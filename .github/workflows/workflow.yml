name: Liveboat feed build

on:
  schedule:
    - cron: "0 * * * *"
  push:
      tags:
        - 'build*'
  # Adds a "Run workflow" button to the Actions tab, so a rebuild no longer
  # needs a `build*` tag pushed from a checkout.
  workflow_dispatch:

jobs:
  liveboat-feed-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:

      # Checks out whatever ref the run was started on, not always main. A feed
      # URL cannot be validated by reading it - the only test is fetching it -
      # so a branch that changes config/urls needs to be buildable before it is
      # merged. The commit and push steps below are gated on main, so a run on
      # a branch fetches the feeds, reports what came back, and writes nothing.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install sqlite3 snapd

      - name: Install newsboat
        run: source ./scripts/retry.sh && with_retry 5 sudo snap install newsboat

      - name: Fetch liveboat
        run: |
          mkdir -p ./bin
          sh -c 'wget -O ./bin/liveboat https://github.com/exaroth/liveboat/releases/download/stable/liveboat-linux-musl && chmod +x ./bin/liveboat'

      - name: Source options
        uses: falti/dotenv-action@v1.1.4
        with:
          path: ./config/page_options
          keys-case: bypass
          export-variables: true

      - name: Set up gitconfig
        run: |
          git config --local user.email "liveboat-builder@github.com"
          git config --local user.name "liveboat-feed-builder"
        shell: bash

      - name: Cleanup last build
        if: github.ref_name == 'main'
        run: |
          if echo $(git log --oneline -1) | grep -q "Feed rebuild @"; then
              git reset --soft HEAD~1
              git stash push -m old_feeds ./docs
          fi
        shell: bash

      - name: Update Liveboat version and templates
        run: |
          make update;
          git add ./templates ./config
        if: env.ENABLE_AUTOMATIC_UPDATES == '1'

      - name: Run newsboat
        run: newsboat -u config/urls -C config/newsboat-config -c cache.db -x reload

      - name: Run liveboat
        run: ./bin/liveboat --template-path templates/custom --config-file config/liveboat-config.toml

      # Roughly half these feeds publish no media in their RSS, and the median
      # item carries one sentence of text, so both the picture and the article
      # body are read off the article page instead. Cached in
      # config/article-cache.json so each article is fetched once, not once an
      # hour. Never fails the build: an article this cannot reach simply keeps
      # whatever its feed gave it.
      - name: Harvest article pictures and text
        run: python3 ./scripts/harvest_articles.py || true
        shell: bash

      # Publishers declare their logo in the page head, at CDN paths no client
      # could guess - which is why guessing three well-known URLs from the
      # browser left most sources showing a monogram. One request per domain,
      # cached, so this is a handful of fetches an hour at most.
      - name: Harvest publisher icons
        run: python3 ./scripts/harvest_icons.py || true
        shell: bash

      # The feed the page actually loads: every source merged, split by day,
      # each day file named by its content hash so a visit after a rebuild only
      # downloads what changed. Runs after the harvest steps, whose pictures and
      # text it packages. If it fails, any stale river is removed so the page
      # falls back to Liveboat's own feed files rather than serving old news.
      - name: Build river
        run: python3 ./scripts/build_river.py || { rm -rf ./docs/river; true; }
        shell: bash

      # A source whose URL has rotted produces no page and says nothing about
      # it, so the site just shows one fewer feed. This turns that into a
      # warning on the run summary. Advisory only - never fails the build.
      - name: Report empty feeds
        run: python3 ./scripts/report_empty_feeds.py || true
        shell: bash

      - name: Truncate database
        run: |
          ./scripts/truncate_db ${{ env.NEWSBOAT_CACHE_RETENTION_DAYS }}
          git add ./cache.db
        if: env.PERSIST_NEWSBOAT_CACHE == '1'

      - name: Commit files
        id: commit
        if: github.ref_name == 'main'
        run: |
          git add ./docs ./config
          let ts=$(date +"%s")
          git diff-index --quiet HEAD || git commit -m "Feed rebuild @ ${ts}" -a
        shell: bash

      - name: Clean unreachable objects
        if: github.ref_name == 'main'
        run: |
          git reflog expire --expire-unreachable=now
          git gc --prune=now

      - name: Push changes
        if: github.ref_name == 'main'
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          force_with_lease: true
          branch: main
